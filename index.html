<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acrobat Reader</title>
    
    <link rel="icon" type="image/png" href="https://cdn.branch.io/branch-assets/1595438809173-og_image.png">

    <style>
        :root {
            --adobe-red: #FA0F00;
            --adobe-blue: #1473E6;
            --text-dark: #2C2C2C;
            --text-gray: #6E6E6E;
            --border-light: #E1E1E1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        /* Background Layer - High Blur */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/YFpKB696/project.png');
            background-size: cover;
            background-position: top center;
            filter: blur(12px); /* Increased blur so text isn't legible */
            z-index: 1;
            transform: scale(1.1); /* Prevents white edges from blur */
        }

        /* Header Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
            border-bottom: 1px solid var(--border-light);
        }

        .nav-left { display: flex; align-items: center; gap: 18px; }
        
        .header-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .btn-trial {
            background: #222;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-signin {
            color: #444;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        /* Generative Banner */
        .gen-banner {
            position: fixed;
            top: 60px;
            width: 100%;
            background: #F8F9FB;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9;
            border-bottom: 1px solid var(--border-light);
        }

        .gen-content { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: #444; }
        
        .btn-continue {
            background: #222;
            color: white;
            padding: 7px 18px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        /* Bottom Sheet Modal */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 20px 24px 45px 24px;
            z-index: 20;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .handle {
            width: 36px;
            height: 4px;
            background: #E0E0E0;
            border-radius: 2px;
            margin-bottom: 25px;
        }

        .logo-box {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .bottom-sheet h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .bottom-sheet p {
            font-size: 16px;
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 35px;
            max-width: 300px;
        }

        /* Button Container */
        .button-group {
            width: 100%;
            display: flex;
            gap: 12px;
            max-width: 500px;
        }

        .btn-web {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            border: 1.5px solid #8E8E8E;
            background: white;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        .btn-get {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            background: var(--adobe-blue);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <nav class="top-nav">
        <div class="nav-left">
            <img src="https://cdn.branch.io/branch-assets/1595438809173-og_image.png" class="header-logo" alt="Logo">
            
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#555"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <div class="nav-right">
            <a href="#" class="btn-trial">Free trial</a>
            <a href="#" class="btn-signin">Sign in</a>
        </div>
    </nav>

    <div class="gen-banner">
        <div class="gen-content">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#6a1b9a"><path d="M19,9L17.5,12.5L14,14L17.5,15.5L19,19L20.5,15.5L24,14L20.5,12.5L19,9M9,4L6.5,9.5L1,12L6.5,14.5L9,20L11.5,14.5L17,12L11.5,9.5L9,4Z"/></svg>
            Generative summary
        </div>
        <button class="btn-continue">Continue</button>
    </div>

    <div class="bottom-sheet">
        <div class="handle"></div>
        
        <div class="logo-box">
            <img src="https://cdn.branch.io/branch-assets/1595438809173-og_image.png" alt="Acrobat Logo">
        </div>

        <h2>Get the Acrobat Reader app</h2>
        <p>Work with PDFs on the go. Fill, sign, share, comment and more.</p>

        <div class="button-group">
            <a href="https://adobe.com" class="btn-web">Continue on web</a>
            <a href="https://adobe.com" class="btn-get">Get app</a>
        </div>
    </div>

</body>
</html>
